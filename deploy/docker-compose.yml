# The orchestrator on a server: Postgres and forgerun server, on port 8080.
# Workers run elsewhere and connect to it. See docs/deploying.md.
#
#   cp .env.example .env    # fill it in
#   docker compose up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forgerun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forgerun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forgerun"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  forgerun:
    build: ..
    command: ["server", "-addr", "0.0.0.0:8080", "-out", "/home/forgerun/out"]
    env_file: .env
    environment:
      FORGERUN_DATABASE_URL: postgres://forgerun:${POSTGRES_PASSWORD}@postgres:5432/forgerun?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - logs:/home/forgerun/out
    restart: unless-stopped

volumes:
  pgdata:
  logs:
